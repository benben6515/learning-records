function woodTexture() {
  const c = document.createElement('canvas');
  c.width = c.height = 512;
  const g = c.getContext('2d');
  g.fillStyle = '#6b4526';
  g.fillRect(0, 0, 512, 512);
  for (let p = 0; p < 8; p++) {
    const x = p * 64;
    g.fillStyle = ['#654023', '#6f4a29', '#5f3c20', '#73502e'][p % 4];
    g.fillRect(x, 0, 64, 512);
    g.strokeStyle = 'rgba(30,16,6,0.55)';
    g.lineWidth = 2;
    g.beginPath(); g.moveTo(x, 0); g.lineTo(x, 512); g.stroke();
    for (let i = 0; i < 22; i++) {
      g.strokeStyle = `rgba(${Math.random() > 0.5 ? '40,22,8' : '140,95,50'},${0.08 + Math.random() * 0.14})`;
      g.lineWidth = 1 + Math.random() * 1.6;
      g.beginPath();
      const gx = x + 4 + Math.random() * 56;
      g.moveTo(gx, 0);
      g.bezierCurveTo(gx + (Math.random() * 14 - 7), 170, gx + (Math.random() * 14 - 7), 340, gx + (Math.random() * 10 - 5), 512);
      g.stroke();
    }
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(3, 1);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

const woodMat = new THREE.MeshStandardMaterial({ color: 0xf3e6d0, roughness: 0.35 });
const milkMat = new THREE.MeshStandardMaterial({ color: 0xf5ead9, roughness: 0.5 });
const creamMat = new THREE.MeshStandardMaterial({ color: 0xfaf3e6, roughness: 0.45 });
const glassMat = new THREE.MeshPhysicalMaterial({ color: 0xd9ecef, roughness: 0.06, metalness: 0, transparent: true, opacity: 0.28, side: THREE.DoubleSide });
const porcelainMats = new Map();

function porcelain(color) {
  if (!porcelainMats.has(color))
    porcelainMats.set(color, new THREE.MeshStandardMaterial({ color, roughness: 0.28, side: THREE.DoubleSide }));
  return porcelainMats.get(color);
}

function lathe(points, mat) {
  return new THREE.Mesh(new THREE.LatheGeometry(points.map(p => new THREE.Vector2(...p)), 36), mat);
}

function cupProfile(h, rBase, rTop) {
  return [
    [0.001, h * 0.09], [rBase * 0.85, h * 0.07], [rBase, h * 0.14], [rTop - 0.02, h - 0.04],
    [rTop, h], [rTop + 0.025, h - 0.05], [rBase + 0.03, h * 0.12], [rBase * 0.6, 0.0], [0.001, 0.0]
  ];
}

function addHandle(group, x, y, z, flip) {
  const handle = new THREE.Mesh(new THREE.TorusGeometry(0.17, 0.038, 12, 24, Math.PI * 1.15), woodMat);
  handle.position.set(x, y, z);
  handle.rotation.z = flip ? Math.PI * 0.92 : Math.PI * -0.07;
  handle.castShadow = true;
  group.add(handle);
}

function addSaucer(group, r) {
  const saucer = new THREE.Mesh(new THREE.CylinderGeometry(r, r * 0.55, 0.06, 36), woodMat);
  saucer.position.y = 0.03;
  saucer.castShadow = saucer.receiveShadow = true;
  group.add(saucer);
}

function addLiquid(group, drink, innerR, baseY, topY) {
  const h = (topY - baseY) * drink.liquidH;
  const y = baseY + h / 2;
  const liquid = new THREE.Mesh(
    new THREE.CylinderGeometry(innerR * 0.94, innerR * 0.8, h, 32),
    new THREE.MeshStandardMaterial({ color: drink.liquid, roughness: 0.15 })
  );
  liquid.position.y = y;
  liquid.castShadow = true;
  group.add(liquid);
  if (drink.crema) {
    const crema = new THREE.Mesh(
      new THREE.CylinderGeometry(innerR * 0.94, innerR * 0.94, 0.025, 32),
      new THREE.MeshStandardMaterial({ color: 0xa5713a, roughness: 0.4 })
    );
    crema.position.y = baseY + h;
    group.add(crema);
  }
  return baseY + h;
}

function addFoam(group, drink, innerR, y) {
  if (!drink.foamH) return y;
  const foam = new THREE.Mesh(
    new THREE.CylinderGeometry(innerR * 0.97, innerR * 0.9, drink.foamH, 32),
    new THREE.MeshStandardMaterial({ color: drink.foam, roughness: 0.55 })
  );
  foam.position.y = y + drink.foamH / 2 - 0.01;
  group.add(foam);
  if (drink.dollop) {
    const dollop = new THREE.Mesh(new THREE.SphereGeometry(innerR * 0.42, 20, 14), milkMat);
    dollop.position.y = y + drink.foamH + 0.06;
    dollop.scale.y = 0.75;
    group.add(dollop);
  }
  return y + drink.foamH;
}

function addCream(group, y, s = 1) {
  const swirl = new THREE.Mesh(new THREE.SphereGeometry(0.26 * s, 24, 18), creamMat);
  swirl.position.y = y + 0.18 * s;
  swirl.scale.set(s, s * 1.25, s);
  group.add(swirl);
  const tip = new THREE.Mesh(new THREE.ConeGeometry(0.07 * s, 0.16 * s, 12), creamMat);
  tip.position.y = y + 0.46 * s;
  group.add(tip);
}

function addIce(group, innerR, y) {
  for (let i = 0; i < 4; i++) {
    const cube = new THREE.Mesh(
      new THREE.BoxGeometry(0.16, 0.16, 0.16),
      new THREE.MeshPhysicalMaterial({ color: 0xdfeef2, roughness: 0.08, transparent: true, opacity: 0.6 })
    );
    cube.position.set((Math.random() - 0.5) * innerR * 1.2, y + 0.02 + (i % 2) * 0.13, (Math.random() - 0.5) * innerR * 1.2);
    cube.rotation.set(Math.random() * 2, Math.random() * 2, Math.random() * 2);
    group.add(cube);
  }
}

function makeLabel(text) {
  const c = document.createElement('canvas');
  c.width = 256; c.height = 64;
  const g = c.getContext('2d');
  g.fillStyle = 'rgba(20,12,6,0.65)';
  g.beginPath(); g.roundRect(2, 10, 252, 44, 10); g.fill();
  g.strokeStyle = 'rgba(222,184,135,0.6)';
  g.lineWidth = 2;
  g.beginPath(); g.roundRect(2, 10, 252, 44, 10); g.stroke();
  g.fillStyle = '#ffe4bd';
  g.font = '24px "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif';
  g.textAlign = 'center';
  g.textBaseline = 'middle';
  g.fillText(text, 128, 33);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false, depthTest: false }));
  sprite.renderOrder = 10;
  sprite.scale.set(1.0, 0.25, 1);
  return sprite;
}

const clickables = [];
const drinkGroups = [];

function buildDrink(drink, index) {
  const group = new THREE.Group();
  const glass = drink.vessel === 'glass';
  const small = drink.vessel === 'small';

  if (!glass) {
    addSaucer(group, small ? 0.62 : 0.82);
    const h = small ? 0.52 : drink.vessel === 'mid' ? 0.62 : 0.95;
    const rBase = small ? 0.3 : drink.vessel === 'mid' ? 0.34 : 0.34;
    const rTop = small ? 0.4 : drink.vessel === 'mid' ? 0.48 : 0.42;
    const cup = lathe(cupProfile(h, rBase, rTop), porcelain(0xf3ead9));
    cup.castShadow = true;
    cup.position.y = 0.06;
    group.add(cup);
    addHandle(group, rTop + 0.1, h * 0.55 + 0.06, 0, false);
    const topY = addLiquid(group, drink, rTop - 0.06, h * 0.16 + 0.06, h - 0.04 + 0.06);
    addFoam(group, drink, rTop - 0.08, topY);
    if (drink.cream) addCream(group, topY + drink.foamH, small ? 0.7 : 0.85);
  } else {
    const h = 1.15, r = 0.34;
    const body = new THREE.Mesh(new THREE.CylinderGeometry(r, r * 0.82, h, 32, 1, true), glassMat);
    body.position.y = 0.03;
    body.castShadow = true;
    group.add(body);
    const bottom = new THREE.Mesh(new THREE.CylinderGeometry(r * 0.82, r * 0.75, 0.05, 32), glassMat);
    bottom.position.y = 0.055;
    group.add(bottom);
    if (drink.glassHandle) addHandle(group, r + 0.12, h * 0.5, 0, false);
    const topY = addLiquid(group, drink, r * 0.88, h * 0.08, h - 0.12);
    if (drink.scoop) {
      const scoop = new THREE.Mesh(new THREE.SphereGeometry(0.31, 24, 18), creamMat);
      scoop.position.y = topY + 0.12;
      scoop.castShadow = true;
      group.add(scoop);
    }
    addFoam(group, drink, r * 0.85, topY);
    if (drink.cream) addCream(group, topY + drink.foamH, 0.8);
    if (drink.ice) addIce(group, r * 0.7, topY - 0.04);
  }

  const box = new THREE.Box3().setFromObject(group);
  const label = makeLabel(drink.zh);
  label.position.y = box.max.y + 0.42;
  group.add(label);

  group.traverse(o => {
    if (o.isMesh || o.isSprite) { o.userData.drinkIndex = index; clickables.push(o); }
  });
  drinkGroups[index] = group;
  return group;
}

DRINKS.forEach((drink, i) => {
  const row = i < 6 ? 0 : 1;
  const col = i % 6;
  const g = buildDrink(drink, i);
  g.position.set((col - 2.5) * 1.85, 0, row === 0 ? -1.25 : 1.25);
  if (row === 1) g.rotation.y = Math.PI;
  scene.add(g);
});

const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
let hovered = null, downPos = null;

function highlight(group, on) {
  group.traverse(o => {
    if (o.isMesh && o.material && 'emissive' in o.material) {
      o.material.emissive.setHex(on ? 0x553311 : 0x000000);
      o.material.emissiveIntensity = on ? 0.5 : 0;
    }
  });
}

function pick(e) {
  pointer.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(clickables, false);
  return hits.length ? hits[0].object.userData.drinkIndex : null;
}

const panel = document.getElementById('panel');

function cupSVG(d) {
  const [bW, tW] = { small: [30, 44], mid: [34, 48], mug: [36, 44], glass: [34, 38] }[d.vessel];
  const cx = 73, yB = 126, yT = 56, H = yB - yT;
  const total = d.parts.reduce((s, p) => s + p[1], 0);
  const wAt = y => bW + (tW - bW) * ((yB - y) / H);
  let y = yB, layers = '';
  for (const [, pct, color] of d.parts) {
    const h = H * pct / total;
    const y2 = y - h, wB = wAt(y), wT = wAt(y2);
    layers += `<path d="M${(cx - wB / 2).toFixed(1)},${y.toFixed(1)} L${(cx + wB / 2).toFixed(1)},${y.toFixed(1)} L${(cx + wT / 2).toFixed(1)},${y2.toFixed(1)} L${(cx - wT / 2).toFixed(1)},${y2.toFixed(1)} Z" fill="${color}" stroke="#3a2412" stroke-opacity="0.3" stroke-width="1"/>`;
    y = y2;
  }
  const dome = (d.cream || d.scoop || d.dollop)
    ? `<path d="M${(cx - tW * 0.42).toFixed(1)},${yT} Q${cx},${yT - 24} ${(cx + tW * 0.42).toFixed(1)},${yT} Z" fill="#faf3e6" stroke="#e0cdb0" stroke-width="1"/>` : '';
  const handle = d.vessel !== 'glass'
    ? `<path d="M${cx + tW + 1},72 A14 14 0 0 1 ${cx + tW + 1},100" fill="none" stroke="#d9b98c" stroke-width="5"/>` : '';
  const saucer = d.vessel !== 'glass'
    ? `<ellipse cx="${cx}" cy="${yB + 9}" rx="53" ry="5" fill="none" stroke="#d9b98c" stroke-width="2"/>`
    : `<line x1="${cx - 44}" y1="${yB + 9}" x2="${cx + 44}" y2="${yB + 9}" stroke="#d9b98c" stroke-width="2"/>`;
  const outline = `<path d="M${cx - bW / 2},${yB} L${cx - tW / 2},${yT} L${cx + tW / 2},${yT} L${cx + bW / 2},${yB}" stroke="#e8d7bc" stroke-width="2.5" fill="none" stroke-linejoin="round"/>`;
  return `<svg width="132" height="146" viewBox="0 0 150 160" aria-hidden="true">${saucer}${layers}${outline}${handle}${dome}</svg>`;
}

function openPanel(i) {
  const d = DRINKS[i];
  document.getElementById('p-name').innerHTML = `${d.zh}<span class="en">${d.name}</span>`;
  document.getElementById('p-ratio').textContent = d.ratio;
  document.getElementById('p-size').textContent = d.size;
  document.getElementById('p-caffeine').textContent = d.caffeine;
  document.getElementById('p-desc').textContent = d.desc;
  document.getElementById('p-svg').innerHTML = cupSVG(d);
  document.getElementById('p-parts').innerHTML = d.parts
    .map(([label, pct, color]) => `<div class="part"><i style="background:${color}"></i>${label}<b>${pct}%</b></div>`).join('');
  panel.classList.add('open');
}

document.getElementById('close').addEventListener('click', () => panel.classList.remove('open'));

renderer.domElement.addEventListener('pointermove', e => {
  const i = pick(e);
  if (hovered !== null && hovered !== i) { highlight(drinkGroups[hovered], false); hovered = null; }
  if (i !== null && i !== hovered) { hovered = i; highlight(drinkGroups[i], true); }
  renderer.domElement.style.cursor = i !== null ? 'pointer' : 'grab';
});

renderer.domElement.addEventListener('pointerdown', e => { downPos = [e.clientX, e.clientY]; });

renderer.domElement.addEventListener('pointerup', e => {
  if (!downPos) return;
  const moved = Math.hypot(e.clientX - downPos[0], e.clientY - downPos[1]);
  downPos = null;
  if (moved > 6) return;
  const i = pick(e);
  if (i !== null) openPanel(i);
  else panel.classList.remove('open');
});

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

renderer.setAnimationLoop(() => {
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
