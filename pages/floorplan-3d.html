<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ================= 基本場景 ================= */
const app = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias: true });

controls.maxPolarAngle = Math.PI * 0.495;
controls.minDistance = 150;
controls.maxDistance = 3200;

const fill = new THREE.DirectionalLight('#dfe8f5', 0.35);
fill.position.set(-500, 600, -650);
scene.add(fill);

/* ================= 材質 ================= */
const M = (c, o = {}) => new THREE.MeshStandardMaterial({ color: c, roughness: 0.88, metalness: 0, ...o });
const mat = {
  wall:      M('#f1efe8'),
  wallExt:   M('#e2dfd4'),
  casing:    M('#f8f7f3'),
  floorWood: M('#d9c9ab'),
  floorTile: M('#d3d6d8'),
  floorTile2:M('#c6cacd'),
  concrete:  M('#c9c4b8'),
  deck:      M('#c8a06c'),
  deck2:     M('#c19a63'),
  glass:     new THREE.MeshPhysicalMaterial({ color: '#cfe4ee', transparent: true, opacity: 0.26, roughness: 0.08, metalness: 0, side: THREE.DoubleSide }),
  white:     M('#f6f5f1'),
  oak:       M('#b98d5f'),
  walnut:    M('#4b3826', { roughness: 0.7 }),
  dark:      M('#2c2a27'),
  fabric:    M('#e9e3d4'),
  fabricHi:  M('#f2ede1'),
  headFab:   M('#cfc9bf'),
  green:     M('#47603f'),
  metal:     M('#c3c7cb', { roughness: 0.35, metalness: 0.7 }),
  mirror:    M('#b9c6cd', { roughness: 0.12, metalness: 0.85 }),
  tv:        M('#15171b', { roughness: 0.3, metalness: 0.4 }),
  fridge:    M('#4e5257', { roughness: 0.5, metalness: 0.3 }),
  doorWood:  M('#c9a06a', { roughness: 0.7 }),
  doorEntry: M('#7a5c3e', { roughness: 0.7 }),
  counter:   M('#eceae4'),
  counterTop:M('#f7f6f2'),
  appliance: M('#eef0f2', { roughness: 0.55 }),
  rug:       M('#d3c9b2'),
  plant:     M('#5c7a4a', { roughness: 1 }),
  pot:       M('#8a5a3b'),
  red:       M('#a8523f'),
  brown:     M('#6b4f3a'),
  charcoal:  M('#3b3b3b'),
  tan:       M('#c9b8a0'),
};

/* ================= 幾何 helper ================= */
const HP = Math.PI / 2;
function add(parent, mesh, x, y, z, o = {}) {
  mesh.position.set(x, y, z);
  if (o.ry) mesh.rotation.y = o.ry;
  if (o.rx) mesh.rotation.x = o.rx;
  if (o.rz) mesh.rotation.z = o.rz;
  if (o.s) mesh.scale.setScalar(o.s);
  mesh.castShadow = o.noShadow ? false : true;
  mesh.receiveShadow = true;
  parent.add(mesh);
  return mesh;
}
// 底面對齊的方塊：y = 底部高度
function B(parent, w, h, d, m, x, y, z, o = {}) {
  const g = new THREE.BoxGeometry(w, h, d);
  g.translate(0, o.mid ? -h / 2 : h / 2, 0);
  return add(parent, new THREE.Mesh(g, m), x, y, z, o);
}
// 圓柱：y = 底部高度（mid 時 y = 中心）
function C(parent, rt, rb, h, m, x, y, z, o = {}) {
  const g = new THREE.CylinderGeometry(rt, rb, h, o.seg || 24);
  g.translate(0, o.mid ? -h / 2 : h / 2, 0);
  return add(parent, new THREE.Mesh(g, m), x, y, z, o);
}

/* ================= 地盤與地面 ================= */
{
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(12000, 12000), M('#dedbd2'));
  ground.rotation.x = -HP;
  ground.position.y = -24;
  ground.receiveShadow = true;
  scene.add(ground);
  const slab = new THREE.Mesh(new THREE.BoxGeometry(885, 24, 860), M('#cbc5b8'));
  slab.position.set(417.5, -12, 405);
  slab.receiveShadow = true; slab.castShadow = true;
  scene.add(slab);
}

/* ================= 房間地板 ================= */
/* 座標：室內左上角為原點，x 向東 0..735，z 向南 0..810（單位 cm） */
const ROOMS = {
  '客廳':   { area: '15.3 m²', mat: mat.floorWood.clone(), label: [175, 430],
              rects: [[0, 342, 255, 645], [0, 137, 645, 758], [342, 388, 552, 645]],
              cam: { p: [180, 500, 1080], t: [180, 40, 440] } },
  '餐廳':   { area: '5.3 m²',  mat: mat.floorWood.clone(), label: [452, 330],
              rects: [[342, 419, 255, 542], [419, 560, 255, 477]],
              cam: { p: [450, 420, 940], t: [452, 40, 360] } },
  '廚房':   { area: '5.9 m²',  mat: mat.floorTile.clone(), label: [620, 330],
              rects: [[419, 560, 477, 542], [560, 735, 255, 542]],
              cam: { p: [620, 420, 980], t: [615, 40, 400] } },
  '臥室A':  { area: '10.4 m²', mat: mat.floorWood.clone(), label: [373, 122],
              rects: [[161, 585, 0, 245]],
              cam: { p: [373, 440, 760], t: [373, 40, 125] } },
  '臥室B':  { area: '8.7 m²',  mat: mat.floorWood.clone(), label: [566, 680],
              rects: [[398, 735, 552, 810]],
              cam: { p: [566, 430, 1240], t: [566, 40, 680] } },
  '浴室A':  { area: '3.6 m²',  mat: mat.floorTile2.clone(), label: [74, 122],
              rects: [[0, 148, 0, 245]],
              cam: { p: [74, 320, 610], t: [74, 40, 125] } },
  '浴室B':  { area: '3.7 m²',  mat: mat.floorTile.clone(), label: [267, 730],
              rects: [[147, 388, 655, 810]],
              cam: { p: [267, 320, 1210], t: [267, 40, 730] } },
  '陽台':   { area: '3.4 m²',  mat: mat.deck.clone(), label: [665, 122],
              rects: [[595, 735, 0, 245]],
              cam: { p: [665, 330, 640], t: [665, 40, 122] } },
  '露台':   { area: '2.8 m²',  mat: mat.deck2.clone(), label: [807, 400],
              rects: [[760, 855, 255, 548]],
              cam: { p: [807, 340, 960], t: [807, 40, 400] } },
  'A/C位置':{ area: '2.5 m²',  mat: mat.concrete.clone(), label: [807, 678],
              rects: [[760, 855, 548, 810]],
              cam: { p: [807, 320, 1220], t: [807, 40, 678] } },
};
const floorMeshes = [];
for (const [name, r] of Object.entries(ROOMS)) {
  for (const [x1, x2, z1, z2] of r.rects) {
    const g = new THREE.BoxGeometry(x2 - x1, 1, z2 - z1);
    const m = new THREE.Mesh(g, r.mat);
    m.position.set((x1 + x2) / 2, 0.5, (z1 + z2) / 2);
    m.receiveShadow = true;
    m.userData.room = name;
    scene.add(m);
    floorMeshes.push(m);
  }
}

/* ================= 牆（含門窗開口）================= */
const WALL_H = 270;
const wallGroup = new THREE.Group();
scene.add(wallGroup);

function wallRun(horizontal, fixed, from, to, t, openings = [], m = mat.wall) {
  const ops = openings.slice().sort((a, b) => a.a - b.a);
  let cur = from;
  const solid = (a, b, y0, y1) => {
    if (b - a <= 0.01 || y1 - y0 <= 0.01) return;
    const c = (a + b) / 2; // box 中心 = 段中點
    B(wallGroup, b - a, y1 - y0, t, m, horizontal ? c : fixed + t / 2, y0, horizontal ? fixed + t / 2 : c,
      horizontal ? {} : { ry: HP });
  };
  const pane = (op) => { // 玻璃 + 窗框
    const cx = horizontal ? (op.a + op.b) / 2 : fixed + t / 2;
    const cz = horizontal ? fixed + t / 2 : (op.a + op.b) / 2;
    const len = op.b - op.a, h = op.y1 - op.y0, cy = (op.y0 + op.y1) / 2;
    const rot = horizontal ? {} : { ry: HP };
    B(wallGroup, len, h, 2, mat.glass, cx, op.y0, cz, rot);
    const f = 6;
    B(wallGroup, len, f, t + 3, mat.casing, cx, op.y1, cz, rot);
    B(wallGroup, len, f, t + 3, mat.casing, cx, op.y0 - f, cz, rot);
    B(wallGroup, f, h, t + 3, mat.casing, horizontal ? op.a + f / 2 : cx, op.y0, cz, rot);
    B(wallGroup, f, h, t + 3, mat.casing, horizontal ? op.b - f / 2 : cx, op.y0, cz, rot);
    B(wallGroup, 4, h, t + 2, mat.casing, cx, op.y0, cz, rot); // 中柱
  };
  const casing = (op) => { // 門框
    const rot = horizontal ? {} : { ry: HP };
    const cx = horizontal ? (op.a + op.b) / 2 : fixed + t / 2;
    const cz = horizontal ? fixed + t / 2 : (op.a + op.b) / 2;
    const len = op.b - op.a;
    B(wallGroup, 5, op.y1, t + 4, mat.casing, horizontal ? op.a + 2.5 : cx, 0, cz, rot);
    B(wallGroup, 5, op.y1, t + 4, mat.casing, horizontal ? op.b - 2.5 : cx, 0, cz, rot);
    B(wallGroup, len, 6, t + 4, mat.casing, cx, op.y1, cz, rot);
  };
  for (const op of ops) {
    if (op.a > cur) solid(cur, op.a, 0, WALL_H);
    solid(op.a, op.b, op.y1, WALL_H);
    if (op.y0 > 0) solid(op.a, op.b, 0, op.y0);
    if (op.glass) pane(op);
    if (op.door) casing(op);
    cur = op.b;
  }
  if (cur < to) solid(cur, to, 0, WALL_H);
}

/* --- 外牆（厚 25）--- */
wallRun(true,  -25, -25, 760, 25, [{ a: 300, b: 520, y0: 90, y1: 220, glass: true }], mat.wallExt);          // 北（臥室A 窗）
wallRun(true,  810, -25, 760, 25, [{ a: 450, b: 680, y0: 90, y1: 220, glass: true }], mat.wallExt);          // 南（臥室B 窗）
wallRun(false, -25, -25, 835, 25, [                                                                          // 西
  { a: 330, b: 500, y0: 90, y1: 220, glass: true },                                                          //   客廳窗
  { a: 660, b: 759, y0: 0,  y1: 205, door: true },                                                           //   大門
], mat.wallExt);
wallRun(false, 735, -25, 835, 25, [                                                                          // 東（全高，矩形收邊）
  { a: 40,  b: 210, y0: 20, y1: 230, glass: true },                                                          //   陽台大窗
  { a: 350, b: 470, y0: 0,  y1: 205, door: true },                                                           //   廚房門通露台
], mat.wallExt);

/* --- 內牆（厚 10）--- */
wallRun(true,  245, 0, 735, 10, [{ a: 170, b: 294, y0: 0, y1: 205, door: true }]);    // 浴室A／臥室A／陽台南牆（臥室A 門）
wallRun(false, 148, 0, 255, 10, [{ a: 185, b: 255, y0: 0, y1: 200, door: true }]);    // 浴室A 東牆（門）
wallRun(false, 585, 0, 245, 10, [{ a: 160, b: 245, y0: 0, y1: 215, door: true }]);    // 臥室A｜陽台隔牆（滑門）
wallRun(true,  542, 342, 735, 10, [{ a: 348, b: 412, y0: 0, y1: 205, door: true }]);  // 廚房南牆／臥室B 北牆（臥室B 門）
wallRun(false, 388, 552, 810, 10);                                                    // 臥室B 西牆／浴室B 東牆
wallRun(true,  645, 137, 398, 10, [{ a: 313, b: 389, y0: 0, y1: 200, door: true }]);  // 浴室B 北牆（門）
wallRun(false, 137, 645, 810, 10);                                                    // 浴室B 西牆
wallRun(false, 240, 655, 810, 10);                                                    // 浴室B 內隔牆
wallRun(true,  758, 0, 137, 10);                                                      // 入口設備走道牆

/* --- 門扇（rot: 0 = 葉片朝 +x，逆時針為正）--- */
function doorLeaf(hx, hz, len, rotDeg, m) {
  const th = rotDeg * Math.PI / 180;
  const dx = Math.cos(th), dz = -Math.sin(th);
  B(wallGroup, len, 204, 4.5, m, hx + dx * len / 2, 0, hz + dz * len / 2, { ry: th });
}
doorLeaf(0, 660, 99, 75, mat.doorEntry);       // 大門（西牆，內開入客廳）
doorLeaf(294, 255, 124, 75, mat.doorWood);     // 臥室A
doorLeaf(148, 255, 70, 90, mat.doorWood);      // 浴室A（葉片貼東牆）
doorLeaf(412, 552, 64, -75, mat.doorWood);     // 臥室B
doorLeaf(389, 655, 76, -90, mat.doorWood);     // 浴室B（葉片貼東牆）
// 陽台滑門：兩片玻璃橫拉
B(wallGroup, 3.5, 208, 43, mat.glass, 590, 0, 181.5);
B(wallGroup, 3.5, 208, 43, mat.glass, 590, 0, 223.5);
B(wallGroup, 8, 214, 4, mat.casing, 590, 0, 160);
B(wallGroup, 8, 214, 4, mat.casing, 590, 0, 245);

/* ================= 欄杆（陽台／露台／AC 平台）================= */
const R = new THREE.Group();
scene.add(R);
function rail(x1, z1, x2, z2) {
  const dx = x2 - x1, dz = z2 - z1;
  const len = Math.hypot(dx, dz);
  const cx = (x1 + x2) / 2, cz = (z1 + z2) / 2;
  const horiz = Math.abs(dx) > Math.abs(dz);
  B(R, horiz ? len : 5, 5, horiz ? 5 : len, mat.metal, cx, 102, cz);   // 扶手
  B(R, horiz ? len : 4, 4, horiz ? 4 : len, mat.metal, cx, 55, cz);    // 中橫桿
  const n = Math.max(2, Math.round(len / 60) + 1);
  for (let i = 0; i < n; i++) {
    const t = i / (n - 1);
    B(R, 4, 105, 4, mat.metal, x1 + dx * t, 0, z1 + dz * t);
  }
}
rail(760, 255, 855, 255);      // 露台北側
rail(855, 255, 855, 810);      // 露台／AC 東側
rail(760, 548, 855, 548);      // 露台｜AC 分隔
rail(760, 810, 855, 810);      // AC 南側

/* ================= 家具 ================= */
const F = new THREE.Group();
scene.add(F);

/* --- 客廳：L 型沙發（背靠北牆，面向電視牆）--- */
{
  B(F, 210, 48, 16, mat.fabric, 145, 0, 270);                        // 背牆

  B(F, 18, 34, 95, mat.fabric, 49, 0, 310);                          // 扶手 ×2

  for (const cx of [88, 145, 202]) B(F, 58, 12, 60, mat.fabricHi, cx, 24, 316);

  B(F, 74, 24, 150, mat.fabric, 84, 0, 432);                         // 貴妃榻

  B(F, 58, 12, 128, mat.fabricHi, 88, 24, 434);
  B(F, 36, 32, 12, mat.brown, 108, 36, 300, { ry: 0.18 });
  B(F, 36, 30, 12, mat.charcoal, 182, 36, 298, { ry: -0.14 });
}
/* 地毯 + 茶几 */
B(F, 230, 1.5, 190, mat.rug, 180, 0.5, 460);
B(F, 105, 5, 60, mat.walnut, 185, 37, 455);
for (const [lx, lz] of [[145, 435], [225, 435], [145, 475], [225, 475]]) B(F, 4, 37, 4, mat.dark, lx, 0, lz);
B(F, 26, 4, 18, mat.red, 170, 42, 448, { ry: 0.2 });
C(F, 6, 8, 16, mat.green, 205, 42, 462);
/* 電視櫃 + 電視（靠浴室B 北牆）*/

B(F, 150, 85, 6, mat.tv, 255, 50, 638);
B(F, 90, 7, 9, mat.dark, 255, 42, 628);

/* ================= 房間標籤（canvas sprite）================= */
const labels = new THREE.Group();

function makeLabel(name, area, x, z) {
  const c = document.createElement('canvas');
  c.width = 512; c.height = 240;
  const ctx = c.getContext('2d');
  ctx.fillStyle = 'rgba(26,28,33,0.78)';
  ctx.beginPath();
  ctx.roundRect(36, 30, 440, 180, 28);
  ctx.fill();
  ctx.strokeStyle = 'rgba(232,201,143,0.5)';
  ctx.lineWidth = 3;
  ctx.stroke();
  ctx.fillStyle = '#f5efdf';
  ctx.font = 'bold 66px "Noto Sans TC", "PingFang TC", sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(name, 256, 96);
  ctx.fillStyle = '#ecc98f';
  ctx.font = '40px "Noto Sans TC", sans-serif';
  ctx.fillText(area, 256, 172);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = 4;
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: false }));
  sp.scale.set(160, 75, 1);
  sp.position.set(x, 320, z);
  sp.renderOrder = 999;
  labels.add(sp);
}
for (const [name, r] of Object.entries(ROOMS)) makeLabel(name, r.area, r.label[0], r.label[1]);

/* ================= 相機 tween 與互動 ================= */
const PRESETS = {
  over: { p: [900, 800, 1500], t: [400, 20, 400] },
  top:  { p: [400, 1550, 402], t: [400, 0, 400] },
};
let anim = null;
const ease = t => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
function flyTo(p, t, dur = 1100) {
  anim = {
    el: 0, dur,
    p0: camera.position.clone(), p1: new THREE.Vector3(...p),
    t0: controls.target.clone(), t1: new THREE.Vector3(...t),
  };
}

const raycaster = new THREE.Raycaster();
const ndc = new THREE.Vector2(-10, -10);
const tip = document.getElementById('tip');
let hover = null, downXY = null, lastEvt = null;

renderer.domElement.addEventListener('pointermove', e => {
  ndc.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  lastEvt = e;
});
renderer.domElement.addEventListener('pointerdown', e => { downXY = [e.clientX, e.clientY]; });
renderer.domElement.addEventListener('pointerup', e => {
  if (!downXY) return;
  const moved = Math.hypot(e.clientX - downXY[0], e.clientY - downXY[1]);
  downXY = null;
  if (moved < 6 && hover) {
    const c = ROOMS[hover].cam;
    flyTo(c.p, c.t);
    setActive('#rooms', hover);
  }
});

function setActive(sel, key) {
  document.querySelectorAll(sel + ' button').forEach(b =>
    b.classList.toggle('on', b.dataset.r === key || b.dataset.v === key));
}
document.querySelectorAll('[data-v]').forEach(b => b.addEventListener('click', () => {
  flyTo(PRESETS[b.dataset.v].p, PRESETS[b.dataset.v].t);
  setActive('[data-v]', b.dataset.v);
  document.querySelectorAll('#rooms button').forEach(x => x.classList.remove('on'));
}));
document.querySelectorAll('#rooms button').forEach(b => b.addEventListener('click', () => {
  const c = ROOMS[b.dataset.r].cam;
  flyTo(c.p, c.t);
  setActive('#rooms', b.dataset.r);
  document.querySelectorAll('[data-v]').forEach(x => x.classList.remove('on'));
}));

/* 開關 */
let halfWall = false;
document.getElementById('t-label').addEventListener('click', e => {
  labels.visible = !labels.visible;
  e.currentTarget.classList.toggle('on', labels.visible);
});
document.getElementById('t-wall').addEventListener('click', e => {
  halfWall = !halfWall;
  e.currentTarget.classList.toggle('on', halfWall);
});
document.getElementById('t-rotate').addEventListener('click', e => {
  controls.autoRotate = !controls.autoRotate;
  controls.autoRotateSpeed = 1.1;
  e.currentTarget.classList.toggle('on', controls.autoRotate);
});

/* ================= 迴圈 ================= */
const clock = new THREE.Clock();
function tick() {
  requestAnimationFrame(tick);
  const dt = clock.getDelta();

  if (anim) {
    anim.el += dt * 1000;
    const k = ease(Math.min(1, anim.el / anim.dur));
    camera.position.lerpVectors(anim.p0, anim.p1, k);
    controls.target.lerpVectors(anim.t0, anim.t1, k);
    if (anim.el >= anim.dur) anim = null;
  }
  const targetScale = halfWall ? 0.45 : 1;
  wallGroup.scale.y += (targetScale - wallGroup.scale.y) * Math.min(1, dt * 8);

  raycaster.setFromCamera(ndc, camera);
  const hit = raycaster.intersectObjects(floorMeshes, false)[0];
  const h = hit ? hit.object.userData.room : null;
  if (h !== hover) {
    hover = h;
    renderer.domElement.style.cursor = h ? 'pointer' : 'grab';
    for (const [name, r] of Object.entries(ROOMS)) {
      r.mat.emissive.setHex(name === h ? 0x2e2a1e : 0x000000);
    }
    tip.style.display = h ? 'block' : 'none';
    if (h) tip.textContent = `${h} · ${ROOMS[h].area}`;
  }
  if (hover && lastEvt) {
    tip.style.left = (lastEvt.clientX + 16) + 'px';
    tip.style.top = (lastEvt.clientY + 14) + 'px';
  }

  controls.update();
  renderer.render(scene, camera);
}
tick();

/* 開場動畫 */
flyTo(PRESETS.over.p, PRESETS.over.t, 1600);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
