<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日文五十音學習</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .carousel-container {
            width: 100%;
            max-width: 400px;
            background: white;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .carousel-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            text-align: center;
        }

        .carousel-header h1 {
            font-size: 24px;
            margin-bottom: 5px;
        }

        .day-counter {
            font-size: 14px;
            opacity: 0.9;
        }

        .carousel-track-wrapper {
            overflow: hidden;
            width: 100%;
        }

        .carousel-track {
            display: flex;
            transition: transform 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            width: 100%;
        }

        .carousel-slide {
            min-width: 100%;
            padding: 30px 20px;
        }

        .slide-title {
            font-size: 28px;
            font-weight: bold;
            color: #333;
            margin-bottom: 10px;
            text-align: center;
        }

        .slide-subtitle {
            font-size: 16px;
            color: #666;
            text-align: center;
            margin-bottom: 25px;
        }

        .kana-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            margin-bottom: 20px;
        }

        .kana-grid.y-row,
        .kana-grid.w-row {
            grid-template-columns: repeat(3, 1fr);
            justify-items: center;
        }

        .kana-card {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            border-radius: 12px;
            padding: 12px 6px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s;
        }

        .kana-card:active {
            transform: scale(0.95);
        }

        .kana-card.hiragana {
            background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
        }

        .kana-card.katakana {
            background: linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 100%);
        }

        .kana-hiragana {
            font-size: 32px;
            font-weight: bold;
            color: #333;
            margin-bottom: 4px;
        }

        .kana-katakana {
            font-size: 28px;
            font-weight: bold;
            color: #333;
            margin-bottom: 4px;
        }

        .kana-romaji {
            font-size: 14px;
            color: #666;
        }

        .memory-tip {
            background: #fff3cd;
            border-left: 4px solid #ffc107;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
        }

        .memory-tip h4 {
            color: #856404;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .memory-tip p {
            color: #666;
            font-size: 14px;
            line-height: 1.5;
        }

        .carousel-controls {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
            gap: 20px;
            background: #f8f9fa;
        }

        .control-btn {
            width: 50px;
            height: 50px;
            border: none;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-size: 20px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .control-btn:active {
            transform: scale(0.9);
            box-shadow: 0 2px 8px rgba(102, 126, 234, 0.4);
        }

        .control-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            box-shadow: none;
        }

        .indicators {
            display: flex;
            gap: 8px;
            justify-content: center;
            padding: 10px;
            flex-wrap: wrap;
        }

        .settings {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            padding: 15px;
            background: #f8f9fa;
            border-top: 1px solid #e0e0e0;
        }

        .settings label {
            font-size: 14px;
            color: #666;
        }

        .settings input {
            width: 60px;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            text-align: center;
        }

        .settings button {
            padding: 8px 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
        }

        .autoplay-indicator {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(102, 126, 234, 0.9);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            display: none;
        }

        .autoplay-indicator.active {
            display: block;
        }

        .indicator {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #ddd;
            border: none;
            cursor: pointer;
            transition: all 0.3s;
        }

        .indicator.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            transform: scale(1.2);
        }

        .progress-bar {
            height: 4px;
            background: #e0e0e0;
            width: 100%;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            transition: width 0.4s;
            width: 0%;
        }

        @media (max-width: 360px) {
            .kana-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }
    </style>
</head>
<body>
    <div class="carousel-container">
        <div class="carousel-header">
            <h1>五十音學習</h1>
            <div class="day-counter">Day <span id="currentDay">1</span> / 18</div>
        </div>

        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>

        <div class="carousel-track-wrapper">
            <div class="carousel-track" id="carouselTrack"></div>
        </div>

        <div class="carousel-controls">
            <button class="control-btn" id="prevBtn" disabled>❮</button>
            <button class="control-btn" id="nextBtn">❯</button>
        </div>

        <div class="indicators" id="indicators"></div>

        <div class="settings">
            <label for="intervalInput">Interval (sec):</label>
            <input type="number" id="intervalInput" min="5" max="120" value="30">
            <button id="toggleAutoplay">▶ Start Auto</button>
        </div>
    </div>

    <div class="autoplay-indicator" id="autoplayIndicator">Auto: <span id="countdown">30</span>s</div>

    <script>
        const slidesData = [
            {
                day: 1,
                title: '第1天：母音',
                subtitle: 'あいうえお (5個)',
                kanas: [
                    { hiragana: 'あ', katakana: 'ア', romaji: 'a' },
                    { hiragana: 'い', katakana: 'イ', romaji: 'i' },
                    { hiragana: 'う', katakana: 'ウ', romaji: 'u' },
                    { hiragana: 'え', katakana: 'エ', romaji: 'e' },
                    { hiragana: 'お', katakana: 'オ', romaji: 'o' }
                ],
                memoryTip: '平：像「安」的草書 / 片：像「A」去掉一橫'
            },
            {
                day: 2,
                title: '第2天：K行(上)',
                subtitle: 'かきく (3個)',
                kanas: [
                    { hiragana: 'か', katakana: 'カ', romaji: 'ka' },
                    { hiragana: 'き', katakana: 'キ', romaji: 'ki' },
                    { hiragana: 'く', katakana: 'ク', romaji: 'ku' }
                ]
            },
            {
                day: 3,
                title: '第3天：K行(下)',
                subtitle: 'けこ (2個)',
                kanas: [
                    { hiragana: 'け', katakana: 'ケ', romaji: 'ke' },
                    { hiragana: 'こ', katakana: 'コ', romaji: 'ko' }
                ]
            },
            {
                day: 4,
                title: '第4天：S行(上)',
                subtitle: 'さしす (3個)',
                kanas: [
                    { hiragana: 'さ', katakana: 'サ', romaji: 'sa' },
                    { hiragana: 'し', katakana: 'シ', romaji: 'shi' },
                    { hiragana: 'す', katakana: 'ス', romaji: 'su' }
                ]
            },
            {
                day: 5,
                title: '第5天：S行(下)',
                subtitle: 'せそ (2個)',
                kanas: [
                    { hiragana: 'せ', katakana: 'セ', romaji: 'se' },
                    { hiragana: 'そ', katakana: 'ソ', romaji: 'so' }
                ],
                memoryTip: 'シ直立，ツ斜躺 / ソ往左，ン往右'
            },
            {
                day: 6,
                title: '第6天：T行(上)',
                subtitle: 'たちつ (3個)',
                kanas: [
                    { hiragana: 'た', katakana: 'タ', romaji: 'ta' },
                    { hiragana: 'ち', katakana: 'チ', romaji: 'chi' },
                    { hiragana: 'つ', katakana: 'ツ', romaji: 'tsu' }
                ],
                memoryTip: 'シ直立，ツ斜躺'
            },
            {
                day: 7,
                title: '第7天：T行(下)',
                subtitle: 'てと (2個)',
                kanas: [
                    { hiragana: 'て', katakana: 'テ', romaji: 'te' },
                    { hiragana: 'と', katakana: 'ト', romaji: 'to' }
                ]
            },
            {
                day: 8,
                title: '第8天：N行(上)',
                subtitle: 'なにぬ (3個)',
                kanas: [
                    { hiragana: 'な', katakana: 'ナ', romaji: 'na' },
                    { hiragana: 'に', katakana: 'ニ', romaji: 'ni' },
                    { hiragana: 'ぬ', katakana: 'ヌ', romaji: 'nu' }
                ]
            },
            {
                day: 9,
                title: '第9天：N行(下)',
                subtitle: 'ねの (2個)',
                kanas: [
                    { hiragana: 'ね', katakana: 'ネ', romaji: 'ne' },
                    { hiragana: 'の', katakana: 'ノ', romaji: 'no' }
                ],
                memoryTip: 'ぬ像「奴」，ね像「根」/ ヌ往右，ネ往左'
            },
            {
                day: 10,
                title: '第10天：H行(上)',
                subtitle: 'はひふ (3個)',
                kanas: [
                    { hiragana: 'は', katakana: 'ハ', romaji: 'ha' },
                    { hiragana: 'ひ', katakana: 'ヒ', romaji: 'hi' },
                    { hiragana: 'ふ', katakana: 'フ', romaji: 'fu' }
                ]
            },
            {
                day: 11,
                title: '第11天：H行(下)',
                subtitle: 'へほ (2個)',
                kanas: [
                    { hiragana: 'へ', katakana: 'ヘ', romaji: 'he' },
                    { hiragana: 'ほ', katakana: 'ホ', romaji: 'ho' }
                ],
                memoryTip: 'は兩撇，ほ有圈 / ハ兩撇，ホ三筆'
            },
            {
                day: 12,
                title: '第12天：M行(上)',
                subtitle: 'まみむ (3個)',
                kanas: [
                    { hiragana: 'ま', katakana: 'マ', romaji: 'ma' },
                    { hiragana: 'み', katakana: 'ミ', romaji: 'mi' },
                    { hiragana: 'む', katakana: 'ム', romaji: 'mu' }
                ]
            },
            {
                day: 13,
                title: '第13天：M行(下)',
                subtitle: 'めも (2個)',
                kanas: [
                    { hiragana: 'め', katakana: 'メ', romaji: 'me' },
                    { hiragana: 'も', katakana: 'モ', romaji: 'mo' }
                ]
            },
            {
                day: 14,
                title: '第14天：Y行',
                subtitle: 'やゆよ (3個)',
                kanas: [
                    { hiragana: 'や', katakana: 'ヤ', romaji: 'ya' },
                    { hiragana: 'ゆ', katakana: 'ユ', romaji: 'yu' },
                    { hiragana: 'よ', katakana: 'ヨ', romaji: 'yo' }
                ],
                isYRow: true
            },
            {
                day: 15,
                title: '第15天：Y行復習',
                subtitle: 'やゆよ 複習',
                kanas: [
                    { hiragana: 'や', katakana: 'ヤ', romaji: 'ya' },
                    { hiragana: 'ゆ', katakana: 'ユ', romaji: 'yu' },
                    { hiragana: 'よ', katakana: 'ヨ', romaji: 'yo' }
                ],
                isYRow: true,
                memoryTip: 'や像家屋的屋頂，ゆ像弓箭的弓，よ像手指的「1」'
            },
            {
                day: 16,
                title: '第16天：R行(上)',
                subtitle: 'らりる (3個)',
                kanas: [
                    { hiragana: 'ら', katakana: 'ラ', romaji: 'ra' },
                    { hiragana: 'り', katakana: 'リ', romaji: 'ri' },
                    { hiragana: 'る', katakana: 'ル', romaji: 'ru' }
                ]
            },
            {
                day: 17,
                title: '第17天：R行(下)',
                subtitle: 'れろ (2個)',
                kanas: [
                    { hiragana: 'れ', katakana: 'レ', romaji: 're' },
                    { hiragana: 'ろ', katakana: 'ロ', romaji: 'ro' }
                ]
            },
            {
                day: 18,
                title: '第18天：W行 + N',
                subtitle: 'わをん (3個)',
                kanas: [
                    { hiragana: 'わ', katakana: 'ワ', romaji: 'wa' },
                    { hiragana: 'を', katakana: 'ヲ', romaji: 'wo' },
                    { hiragana: 'ん', katakana: 'ン', romaji: 'n' }
                ],
                isYRow: true,
                memoryTip: 'ソ往左，ン往右'
            }
        ];

        let currentIndex = 0;
        let startX = 0;
        let currentTranslate = 0;
        let prevTranslate = 0;
        let isDragging = false;
        let autoplayInterval = null;
        let countdownInterval = null;
        let isAutoplaying = false;
        let countdownValue = 30;

        const carouselTrack = document.getElementById('carouselTrack');
        const carouselTrackWrapper = carouselTrack.parentElement;
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const indicatorsContainer = document.getElementById('indicators');
        const currentDayEl = document.getElementById('currentDay');
        const progressFill = document.getElementById('progressFill');
        const intervalInput = document.getElementById('intervalInput');
        const toggleAutoplayBtn = document.getElementById('toggleAutoplay');
        const autoplayIndicator = document.getElementById('autoplayIndicator');
        const countdownEl = document.getElementById('countdown');

        // Generate slides
        function generateSlides() {
            slidesData.forEach((slide, index) => {
                const slideEl = document.createElement('div');
                slideEl.className = 'carousel-slide';
                slideEl.dataset.index = index;

                let kanaGridClass = 'kana-grid';
                if (slide.isYRow) {
                    kanaGridClass += ' y-row';
                }

                let memoryTipHtml = '';
                if (slide.memoryTip) {
                    memoryTipHtml = `
                        <div class="memory-tip">
                            <h4>💡 記憶技巧</h4>
                            <p>${slide.memoryTip}</p>
                        </div>
                    `;
                }

                slideEl.innerHTML = `
                    <div class="slide-title">${slide.title}</div>
                    <div class="slide-subtitle">${slide.subtitle}</div>
                    <div class="${kanaGridClass}">
                        ${slide.kanas.map(kana => `
                            <div class="kana-card">
                                <div class="kana-hiragana">${kana.hiragana}</div>
                                <div class="kana-katakana">${kana.katakana}</div>
                                <div class="kana-romaji">${kana.romaji}</div>
                            </div>
                        `).join('')}
                    </div>
                    ${memoryTipHtml}
                `;

                carouselTrack.appendChild(slideEl);

                // Generate indicator
                const indicator = document.createElement('button');
                indicator.className = 'indicator';
                indicator.dataset.index = index;
                indicator.addEventListener('click', () => goToSlide(index));
                indicatorsContainer.appendChild(indicator);
            });

            updateUI();
        }

        function updateUI() {
            currentTranslate = -currentIndex * 100;
            carouselTrack.style.transform = `translateX(${currentTranslate}%)`;

            prevBtn.disabled = currentIndex === 0;
            nextBtn.disabled = currentIndex === slidesData.length - 1;

            currentDayEl.textContent = currentIndex + 1;

            // Update indicators
            document.querySelectorAll('.indicator').forEach((ind, index) => {
                ind.classList.toggle('active', index === currentIndex);
            });

            // Update progress bar
            const progress = ((currentIndex + 1) / slidesData.length) * 100;
            progressFill.style.width = `${progress}%`;
        }

        function goToSlide(index) {
            currentIndex = index;
            updateUI();
            if (isAutoplaying) resetAutoplay();
        }

        function nextSlide() {
            if (currentIndex < slidesData.length - 1) {
                currentIndex++;
            } else {
                currentIndex = 0;
            }
            updateUI();
            if (isAutoplaying) resetAutoplay();
        }

        function startAutoplay() {
            const interval = parseInt(intervalInput.value) * 1000;
            if (interval < 5000 || interval > 120000) {
                alert('Interval must be between 5 and 120 seconds');
                return;
            }

            isAutoplaying = true;
            countdownValue = parseInt(intervalInput.value);
            localStorage.setItem('carouselInterval', intervalInput.value);
            toggleAutoplayBtn.textContent = '⏸ Stop Auto';
            autoplayIndicator.classList.add('active');

            countdownInterval = setInterval(() => {
                countdownValue--;
                countdownEl.textContent = countdownValue;
                if (countdownValue <= 0) {
                    nextSlide();
                    countdownValue = parseInt(intervalInput.value);
                    countdownEl.textContent = countdownValue;
                }
            }, 1000);
        }

        function stopAutoplay() {
            isAutoplaying = false;
            clearInterval(countdownInterval);
            toggleAutoplayBtn.textContent = '▶ Start Auto';
            autoplayIndicator.classList.remove('active');
        }

        function resetAutoplay() {
            if (!isAutoplaying) return;
            clearInterval(countdownInterval);
            countdownValue = parseInt(intervalInput.value);
            countdownEl.textContent = countdownValue;
            countdownInterval = setInterval(() => {
                countdownValue--;
                countdownEl.textContent = countdownValue;
                if (countdownValue <= 0) {
                    nextSlide();
                    countdownValue = parseInt(intervalInput.value);
                    countdownEl.textContent = countdownValue;
                }
            }, 1000);
        }

        function toggleAutoplay() {
            if (isAutoplaying) {
                stopAutoplay();
            } else {
                startAutoplay();
            }
        }

        function prevSlide() {
            if (currentIndex > 0) {
                currentIndex--;
                updateUI();
                if (isAutoplaying) resetAutoplay();
            }
        }

        // Touch events for swipe
        carouselTrackWrapper.addEventListener('touchstart', (e) => {
            startX = e.touches[0].clientX;
            isDragging = true;
            carouselTrack.style.transition = 'none';
        });

        carouselTrackWrapper.addEventListener('touchmove', (e) => {
            if (!isDragging) return;
            const currentX = e.touches[0].clientX;
            const diff = currentX - startX;
            carouselTrack.style.transform = `translateX(${currentTranslate + diff}px)`;
            e.preventDefault();
        }, { passive: false });

        carouselTrackWrapper.addEventListener('touchend', (e) => {
            isDragging = false;
            carouselTrack.style.transition = 'transform 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94)';

            const endX = e.changedTouches[0].clientX;
            const diff = startX - endX;

            let navigated = false;
            if (Math.abs(diff) > 50) {
                if (diff > 0 && currentIndex < slidesData.length - 1) {
                    currentIndex++;
                    navigated = true;
                } else if (diff < 0 && currentIndex > 0) {
                    currentIndex--;
                    navigated = true;
                }
            }

            updateUI();
            if (navigated && isAutoplaying) resetAutoplay();
        });

        // Mouse events for desktop
        carouselTrackWrapper.addEventListener('mousedown', (e) => {
            startX = e.clientX;
            isDragging = true;
            carouselTrack.style.transition = 'none';
        });

        carouselTrackWrapper.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            const currentX = e.clientX;
            const diff = currentX - startX;
            carouselTrack.style.transform = `translateX(${currentTranslate + diff}px)`;
        });

        carouselTrackWrapper.addEventListener('mouseup', (e) => {
            isDragging = false;
            carouselTrack.style.transition = 'transform 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94)';

            const endX = e.clientX;
            const diff = startX - endX;

            let navigated = false;
            if (Math.abs(diff) > 50) {
                if (diff > 0 && currentIndex < slidesData.length - 1) {
                    currentIndex++;
                    navigated = true;
                } else if (diff < 0 && currentIndex > 0) {
                    currentIndex--;
                    navigated = true;
                }
            }

            updateUI();
            if (navigated && isAutoplaying) resetAutoplay();
        });

        carouselTrackWrapper.addEventListener('mouseleave', () => {
            if (isDragging) {
                isDragging = false;
                carouselTrack.style.transition = 'transform 0.4s cubic-bezier(0.46, 0.45, 0.94)';
                updateUI();
            }
        });

        // Button events
        prevBtn.addEventListener('click', prevSlide);
        nextBtn.addEventListener('click', nextSlide);
        toggleAutoplayBtn.addEventListener('click', toggleAutoplay);

        // Interval input change
        intervalInput.addEventListener('change', () => {
            const value = parseInt(intervalInput.value);
            if (value >= 5 && value <= 120) {
                localStorage.setItem('carouselInterval', value);
                if (isAutoplaying) {
                    stopAutoplay();
                    startAutoplay();
                }
            }
        });

        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') prevSlide();
            if (e.key === 'ArrowRight') nextSlide();
            if (e.key === ' ') {
                e.preventDefault();
                toggleAutoplay();
            }
        });

        // Initialize
        const savedInterval = localStorage.getItem('carouselInterval');
        if (savedInterval) {
            intervalInput.value = savedInterval;
        }
        generateSlides();
    </script>
</body>
</html>
